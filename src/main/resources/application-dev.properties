# =====================================================================
#  "dev" profile: runs without a SQL Server installation, using an
#  in-memory H2 database in SQL Server compatibility mode, created from
#  database/schema.sql + database/seed.sql on every start.
#  Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================
spring.datasource.url=jdbc:h2:mem:artistikcity;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
app.template-cache=false
app.payment-test-mode=true
