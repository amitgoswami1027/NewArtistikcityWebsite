# =====================================================================
#  ArtistikCity - Spring Boot configuration
#  Every value can be overridden with an environment variable
#  (e.g. DB_URL, DB_USERNAME, MAIL_HOST ...) - see README.md
# =====================================================================
spring.application.name=artistikcity
server.port=${PORT:8080}

app.name=${APP_NAME:ArtistikCity}
# public uploads (Laravel storage/app/public) - served at /storage/**
app.storage-dir=${STORAGE_DIR:storage}
app.asset-version=1
app.template-cache=true
# e-mail address that receives contact form messages
app.admin-email=${MAIL_ADMIN_EMAIL:admin@artistik.com}

# ---------------------------------------------------------------------
# MySQL 8.x
#   Defaults match the portable MySQL that START-ArtistikCity.bat sets up in .tools\mysql
#   (127.0.0.1:3306, database artistikcity, user artistik). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/artistikcity?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:artistik}
spring.datasource.password=${DB_PASSWORD:Artistik@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Create tables + demo data on start-up: set DB_INIT=always ONCE on an empty database
# (schema.sql drops and recreates all tables!). Default: never. The launcher does this automatically
# the first time it creates the portable database.
spring.sql.init.mode=${DB_INIT:never}
spring.sql.init.schema-locations=file:database/schema.sql
spring.sql.init.data-locations=file:database/seed.sql
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------
# allow <input type="hidden" name="_method" value="PATCH|DELETE"> like Laravel's @method()
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=artistikcity_session
server.servlet.session.cookie.http-only=true
spring.mustache.check-template-location=false

# ---------------------------------------------------------------------
# Mail (leave MAIL_HOST empty to only log e-mails)
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:no-reply@artistikcity.com}

# ---------------------------------------------------------------------
# Payments
# ---------------------------------------------------------------------
# dev only: complete a simulated payment when no gateway keys are configured
app.payment-test-mode=${PAYMENT_TEST_MODE:false}
razorpay.key=${RAZORPAY_KEY:}
razorpay.secret=${RAZORPAY_SECRET:}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.secret=${PAYPAL_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}

# ---------------------------------------------------------------------
# Authentication (package com.artistikcity.auth) - see README "Sign-in & security"
# ---------------------------------------------------------------------
# Public URL of the site, used in e-mail links, OAuth redirect URIs and passkey checks.
# Set it in production (e.g. https://www.artistikcity.com); empty = taken from each request.
app.url=${APP_URL:}
# Session cookies: Secure flag "auto" = on when the request came over HTTPS (also behind a proxy
# sending X-Forwarded-Proto). Use "true" in production.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:auto}
app.auth.session-idle-minutes=${AUTH_SESSION_IDLE_MINUTES:30}
app.auth.session-rotate-minutes=${AUTH_SESSION_ROTATE_MINUTES:15}
app.auth.session-max-hours=${AUTH_SESSION_MAX_HOURS:12}
app.auth.remember-days=${AUTH_REMEMBER_DAYS:30}
# Phone numbers typed without a country code
app.auth.default-country-code=${AUTH_DEFAULT_COUNTRY_CODE:91}
# Server secret for OTP hashes (any long random string). Required in production.
app.auth.otp-secret=${OTP_SECRET:}
# Passkeys: relying-party id (your domain, e.g. artistikcity.com) and allowed origins (comma separated).
# Empty = derived from APP_URL / the request.
app.auth.webauthn.rp-id=${WEBAUTHN_RP_ID:}
app.auth.webauthn.origins=${WEBAUTHN_ORIGINS:}

# SMS gateway for OTP codes: "log" (development: written to the log) or "twilio"
app.sms.provider=${SMS_PROVIDER:log}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# HTTP session (CSRF token, flash messages, cart; the login itself lives in auth_sessions)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Behind a reverse proxy / load balancer, set FORWARD_HEADERS=framework so client IPs and https are detected
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# ---------------------------------------------------------------------
# Google / Facebook sign-in. Redirect URIs to register with the providers:
#   {APP_URL}/social-login/google/callback   and   {APP_URL}/social-login/facebook/callback
# ---------------------------------------------------------------------
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
social.facebook.client-id=${FACEBOOK_CLIENT_ID:}
social.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
# Facebook only returns confirmed e-mail addresses; set to false to never merge accounts on a Facebook e-mail
social.facebook.trust-email=${FACEBOOK_TRUST_EMAIL:true}

logging.level.com.artistikcity=INFO

# ---- Artist Commission Portal ----
# USD -> INR rate used when customers pay with Razorpay (UPI / cards)
commission.inr-per-usd=${COMMISSION_INR_PER_USD:84}
# Webhook secret configured in Razorpay Dashboard > Webhooks (for /api/commissions/finalize-webhook)
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Webhook ID from PayPal Developer Dashboard (used to verify PayPal webhook signatures)
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
