# =====================================================================
#  ArtistikCity - every setting lives in ONE file: config/artistikcity.yml (project root).
#  This file only loads it: first the copy packaged in the jar (defaults), then ./config/artistikcity.yml
#  next to where the app runs (your edits). Environment variables still override single values.
# =====================================================================
spring.config.import=classpath:artistikcity.yml,optional:file:./config/artistikcity.yml
