# =====================================================================
#  "dev" profile: local development against MySQL.
#  Uses the same MySQL connection as the default profile (see application.properties),
#  turns off template caching and allows simulated payments when no gateway keys are set.
#  Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  First run on an empty database: add DB_INIT=always once to create the tables and demo data.
# =====================================================================
app.template-cache=false
app.payment-test-mode=true
